<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2328" fill-opacity=".07"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="c"><rect width="1200" height="340" rx="20"/></clipPath>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset=".35" stop-color="#8b5cf6"/>
      <stop offset=".5" stop-color="#c4b5fd"/>
      <stop offset=".65" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2f81f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    text { white-space: pre; }
    .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; }
    .orb { animation: orb 14s ease-in-out infinite alternate; }
    @keyframes orb { from { transform: translate(0,0); } to { transform: translate(-50px,25px); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .flow { stroke-dasharray: 4 10; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .node { animation: pulse 3s ease-in-out infinite; }
    .ln { opacity: 0; animation: type 9s ease-out infinite; }
    @keyframes type { 0% { opacity: 0; transform: translateX(-6px); } 4% { opacity: 1; transform: none; } 86% { opacity: 1; } 92%,100% { opacity: 0; } }
    .tail { animation: tail 2.8s ease-in-out infinite; transform-origin: 16px -6px; }
    @keyframes tail { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-22deg); } }
    .eyes { animation: catblink 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes catblink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .ear { animation: ear 6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
    @keyframes ear { 0%,80%,100% { transform: rotate(0); } 84% { transform: rotate(-8deg); } 88% { transform: rotate(4deg); } }
    .steam { opacity: 0; animation: steam 2.1s ease-out infinite; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-10px); } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>

  <g clip-path="url(#c)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <circle class="orb" cx="980" cy="90" r="170" fill="#2f81f7" opacity=".16" filter="url(#blur)"/>
    <circle class="orb" cx="1120" cy="300" r="150" fill="#8b5cf6" opacity=".18" filter="url(#blur)"/>
  </g>
  <g clip-path="url(#c)" opacity=".55">
    <g stroke="#2f81f7" stroke-opacity=".5" stroke-width="1.2" fill="none">
      <path class="flow" d="M640 300 L720 250 L700 150 L760 40"/>
      <path class="flow" d="M720 250 L1160 300" style="animation-delay:-.4s"/>
      <path class="flow" d="M700 150 L640 60" style="animation-delay:-.8s"/>
      <path class="flow" d="M1160 300 L1170 180 L1150 40" style="animation-delay:-1.2s"/>
    </g>
    <g fill="#58a6ff">
      <circle class="node" cx="640" cy="300" r="3.5"/>
      <circle class="node" cx="720" cy="250" r="4" style="animation-delay:-.6s"/>
      <circle class="node" cx="700" cy="150" r="3.5" style="animation-delay:-1.2s"/>
      <circle class="node" cx="760" cy="40" r="3" style="animation-delay:-1.8s"/>
      <circle class="node" cx="640" cy="60" r="3" style="animation-delay:-.3s"/>
      <circle class="node" cx="1160" cy="300" r="4" style="animation-delay:-2.1s"/>
      <circle class="node" cx="1170" cy="180" r="3.5" style="animation-delay:-.9s"/>
      <circle class="node" cx="1150" cy="40" r="3" style="animation-delay:-1.5s"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="20" fill="none" stroke="#d0d7de"/>

  <g class="sans">
    <rect x="72" y="68" width="232" height="30" rx="15" fill="#2f81f7" fill-opacity=".1" stroke="#2f81f7" stroke-opacity=".35"/>
    <circle class="pulse" cx="92" cy="83" r="4.5" fill="#1a7f37"/>
    <text x="106" y="88" font-size="13" font-weight="600" fill="#0969da" letter-spacing=".5">Open to collaboration</text>

    <text x="70" y="168" font-size="60" font-weight="700" fill="#1f2328" letter-spacing="-1">Ibraheem Ayub</text>
    <text x="72" y="210" font-size="22" font-weight="600" fill="url(#shimmer)">Full Stack Engineer at Dev Valley</text>
    <text x="72" y="250" font-size="17" fill="#57606a">Building scalable web products with the MERN stack,</text>
    <text x="72" y="276" font-size="17" fill="#57606a">AI integration, and SEO that performs.</text>
  </g>

  <!-- code window -->
  <g filter="url(#shadow)">
    <rect x="770" y="70" width="360" height="200" rx="14" fill="#161b22" stroke="#30363d"/>
  </g>
  <path d="M770 84 a14 14 0 0 1 14 -14 h332 a14 14 0 0 1 14 14 v18 h-360z" fill="#1c2129"/>
  <line x1="770" y1="102" x2="1130" y2="102" stroke="#30363d"/>
  <circle cx="792" cy="86" r="5" fill="#ff5f57"/><circle cx="810" cy="86" r="5" fill="#febc2e"/><circle cx="828" cy="86" r="5" fill="#28c840"/>
  <text x="950" y="90" class="mono" font-size="12" fill="#7d8590" text-anchor="middle">profile.ts</text>
  <g class="mono" font-size="13.5" xml:space="preserve">
    <text class="ln" style="animation-delay:0s" x="794" y="130"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3"> ibraheem = {</tspan></text>
    <text class="ln" style="animation-delay:.45s" x="794" y="152"><tspan fill="#79c0ff">  fuel</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"coffee"</tspan><tspan fill="#e6edf3">,</tspan></text>
    <text class="ln" style="animation-delay:.9s" x="794" y="174"><tspan fill="#79c0ff">  buddy</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"cat"</tspan><tspan fill="#e6edf3">,</tspan></text>
    <text class="ln" style="animation-delay:1.35s" x="794" y="196"><tspan fill="#79c0ff">  stack</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">"MERN"</tspan><tspan fill="#e6edf3">,</tspan></text>
    <text class="ln" style="animation-delay:1.8s" x="794" y="218"><tspan fill="#79c0ff">  ships</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#ffa657">true</tspan><tspan fill="#e6edf3">,</tspan></text>
    <text class="ln" style="animation-delay:2.25s" x="794" y="240"><tspan fill="#e6edf3">};</tspan><tspan class="blink" fill="#2f81f7"> ▍</tspan></text>
  </g>

  <!-- cat sitting on the editor -->
  <g transform="translate(1078 70) scale(.82)">
    <path class="tail" d="M16,-6 C40,-2 46,-26 36,-40" fill="none" stroke="#05070a" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="0" cy="-24" rx="21" ry="25" fill="#05070a"/>
    <circle cx="-7" cy="-56" r="15" fill="#05070a"/>
    <path class="ear" d="M-20,-62 L-18,-80 L-8,-69 Z M-2,-69 L4,-80 L7,-62 Z" fill="#05070a"/>
    <g class="eyes" fill="#3fb950">
      <ellipse cx="-12" cy="-57" rx="2.6" ry="3.4"/>
      <ellipse cx="-2" cy="-57" rx="2.6" ry="3.4"/>
    </g>
  </g>

  <!-- coffee mug -->
  <g transform="translate(712 236)" class="mug">
    <g fill="none" stroke-linecap="round" stroke-width="2.4" stroke="#8b949e">
      <path class="steam" d="M8,-8 c-5,-6 5,-10 0,-17"/>
      <path class="steam" d="M17,-8 c-5,-6 5,-10 0,-17" style="animation-delay:-.7s"/>
      <path class="steam" d="M26,-8 c-5,-6 5,-10 0,-17" style="animation-delay:-1.4s"/>
    </g>
    <path d="M0,0 H34 V22 a10,10 0 0 1 -10,10 H10 a10,10 0 0 1 -10,-10 Z" fill="#57606a"/>
    <path d="M34,5 h5 a7,7 0 0 1 0,14 h-5" fill="none" stroke="#57606a" stroke-width="4"/>
    <rect x="-4" y="34" width="42" height="4" rx="2" fill="#57606a"/>
  </g>

  <rect x="0" y="337" width="1200" height="3" fill="url(#accent)" clip-path="url(#c)"/>
</svg>
