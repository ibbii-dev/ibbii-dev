<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .ico { fill: none; stroke: #57606a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .solid { fill: #57606a; }
    .op { fill: #57606a; }
    .lbl { font: 600 13px 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; fill: #656d76; letter-spacing: 2px; }
    .scr { animation: scr 3s ease-in-out infinite; }
    @keyframes scr { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .codeln { animation: codeln 2.4s steps(4) infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes codeln { 0% { transform: scaleX(.2); } 100% { transform: scaleX(1); } }
    .steam { opacity: 0; animation: steam 2.2s ease-out infinite; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
    .blink { animation: blink 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%,90%,100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
    .twitch { animation: twitch 5s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
    @keyframes twitch { 0%,78%,100% { transform: rotate(0); } 82% { transform: rotate(-10deg); } 86% { transform: rotate(5deg); } }
    .code { animation: code 2.6s ease-in-out infinite; }
    @keyframes code { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  </style>

  <rect x="1" y="1" width="1198" height="198" rx="18" fill="#ffffff" stroke="#d0d7de"/>

  <!-- laptop -->
  <g transform="translate(250 100)">
    <rect class="ico" x="-48" y="-40" width="96" height="62" rx="7"/>
    <rect class="scr" x="-38" y="-30" width="76" height="42" rx="3" fill="#2f81f7" fill-opacity=".18"/>
    <rect class="codeln" x="-32" y="-22" width="40" height="4" rx="2" fill="#58a6ff"/>
    <rect class="codeln" x="-32" y="-12" width="56" height="4" rx="2" fill="#8b5cf6" style="animation-delay:-.6s"/>
    <rect class="codeln" x="-26" y="-2" width="30" height="4" rx="2" fill="#1a7f37" style="animation-delay:-1.2s"/>
    <rect class="solid" x="-64" y="30" width="128" height="9" rx="4.5"/>
    <text class="lbl" x="0" y="74" text-anchor="middle">LAPTOP</text>
  </g>

  <g class="op"><rect x="356" y="96" width="34" height="8" rx="4"/><rect x="369" y="83" width="8" height="34" rx="4"/></g>

  <!-- coffee -->
  <g transform="translate(470 100)">
    <g class="ico" style="stroke-width:4">
      <path class="steam" d="M-14,-34 c-6,-7 6,-11 0,-19"/>
      <path class="steam" d="M0,-36 c-6,-7 6,-11 0,-19" style="animation-delay:-.7s"/>
      <path class="steam" d="M14,-34 c-6,-7 6,-11 0,-19" style="animation-delay:-1.4s"/>
    </g>
    <path class="solid" d="M-34,-22 H30 V8 a20,20 0 0 1 -20,20 H-14 a20,20 0 0 1 -20,-20 Z"/>
    <path class="ico" d="M30,-14 h6 a11,11 0 0 1 0,22 h-6"/>
    <rect class="solid" x="-44" y="32" width="88" height="7" rx="3.5"/>
    <text class="lbl" x="0" y="74" text-anchor="middle">COFFEE</text>
  </g>

  <g class="op"><rect x="566" y="96" width="34" height="8" rx="4"/><rect x="579" y="83" width="8" height="34" rx="4"/></g>

  <!-- cat face -->
  <g transform="translate(690 100)">
    <g class="twitch"><path class="ico" d="M-36,-14 L-38,-48 L-14,-32"/></g>
    <g class="twitch" style="animation-delay:-2.5s"><path class="ico" d="M36,-14 L38,-48 L14,-32"/></g>
    <path class="ico" d="M-14,-32 Q0,-37 14,-32 Q40,-22 38,4 Q34,32 0,34 Q-34,32 -38,4 Q-40,-22 -14,-32"/>
    <g class="blink" fill="#1a7f37" filter="url(#glow)">
      <ellipse cx="-14" cy="-2" rx="4.5" ry="6"/>
      <ellipse cx="14" cy="-2" rx="4.5" ry="6"/>
    </g>
    <path d="M-4,10 L4,10 L0,15 Z" fill="#57606a"/>
    <g class="ico" style="stroke-width:2.5">
      <path d="M-22,12 L-48,8 M-22,17 L-48,20 M22,12 L48,8 M22,17 L48,20"/>
    </g>
    <text class="lbl" x="0" y="74" text-anchor="middle">CAT</text>
  </g>

  <g class="op"><rect x="782" y="88" width="36" height="8" rx="4"/><rect x="782" y="104" width="36" height="8" rx="4"/></g>

  <!-- code -->
  <g transform="translate(930 100)" class="code">
    <g fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M-40,-30 L-70,0 L-40,30"/>
      <path d="M40,-30 L70,0 L40,30"/>
      <path d="M14,-40 L-14,40"/>
    </g>
    <text class="lbl" x="0" y="74" text-anchor="middle">CODE</text>
  </g>
</svg>
