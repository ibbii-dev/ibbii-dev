<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f81f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; }
    .title { font-size: 20px; font-weight: 700; fill: #1f2328; }
    .desc { font-size: 14.5px; fill: #57606a; }
    .tag { font-size: 12px; font-weight: 600; fill: #0969da; }
    .trail { fill: none; stroke: url(#accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 200 1600; animation: trail 7s linear infinite; }
    @keyframes trail { to { stroke-dashoffset: -1800; } }
    .seg { animation: seg 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: left; }
    @keyframes seg { 0% { transform: scaleX(0); } 60%,100% { transform: scaleX(1); } }
    .ok { opacity: 0; animation: ok 3.6s ease-in-out infinite; }
    @keyframes ok { 0%,60% { opacity: 0; } 70%,100% { opacity: 1; } }
    .n { animation: n 2.4s ease-in-out infinite; }
    @keyframes n { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 4s ease-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 600; } 55%,100% { stroke-dashoffset: 0; } }
    .ui { opacity: 0; animation: ui 5s ease-out infinite; }
    @keyframes ui { 0% { opacity: 0; transform: translateY(8px); } 10% { opacity: 1; transform: none; } 85% { opacity: 1; } 95%,100% { opacity: 0; } }
    .bolt { animation: bolt 1.8s steps(1) infinite; }
    @keyframes bolt { 0%,60% { opacity: 1; } 61%,70% { opacity: .2; } 71%,100% { opacity: 1; } }
    .fade { opacity: 0; animation: fade 4s ease-out infinite; }
    @keyframes fade { 0%,40% { opacity: 0; } 60%,100% { opacity: 1; } }
  </style>

  <!-- Card 1: Full-stack -->
  <g transform="translate(0 0)">
    <rect x="1" y="1" width="588" height="318" rx="18" fill="url(#card)" stroke="#d0d7de"/>
    <rect class="trail" x="1" y="1" width="588" height="318" rx="18" pathLength="1800"/>
    <rect x="28" y="28" width="48" height="48" rx="12" fill="#2f81f7" fill-opacity=".12" stroke="#2f81f7" stroke-opacity=".4"/>
    <text x="52" y="59" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#0969da">&lt;/&gt;</text>
    <text x="28" y="112" class="sans title">Full-Stack Development</text>
    <text x="28" y="140" class="sans desc">End-to-end web apps with MongoDB,</text>
    <text x="28" y="161" class="sans desc">Express, React and Node.js.</text>
    <g class="mono" font-size="12">
      <text x="28" y="204" fill="#57606a">build</text>
      <rect x="80" y="195" width="380" height="10" rx="5" fill="#eaeef2"/>
      <rect class="seg" x="80" y="195" width="380" height="10" rx="5" fill="url(#accent)"/>
      <text class="ok" x="474" y="204" fill="#1a7f37">✓ passing</text>
    </g>
    <g class="sans tag">
      <rect x="28" y="250" width="62" height="26" rx="13" fill="#2f81f7" fill-opacity=".1"/><text x="59" y="267" text-anchor="middle">React</text>
      <rect x="98" y="250" width="70" height="26" rx="13" fill="#2f81f7" fill-opacity=".1"/><text x="133" y="267" text-anchor="middle">Node.js</text>
      <rect x="176" y="250" width="80" height="26" rx="13" fill="#2f81f7" fill-opacity=".1"/><text x="216" y="267" text-anchor="middle">MongoDB</text>
    </g>
  </g>

  <!-- Card 2: AI -->
  <g transform="translate(612 0)">
    <rect x="1" y="1" width="588" height="318" rx="18" fill="url(#card)" stroke="#d0d7de"/>
    <rect class="trail" x="1" y="1" width="588" height="318" rx="18" pathLength="1800" style="animation-delay:-2s"/>
    <rect x="28" y="28" width="48" height="48" rx="12" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".45"/>
    <g transform="translate(52 52)" fill="none" stroke="#a78bfa" stroke-width="1.8">
      <rect x="-11" y="-11" width="22" height="22" rx="4"/>
      <path d="M-5 -11v-5M5 -11v-5M-5 11v5M5 11v5M-11 -5h-5M-11 5h-5M11 -5h5M11 5h5"/>
      <text x="0" y="5" text-anchor="middle" class="sans" font-size="11" font-weight="800" fill="#6d28d9" stroke="none">AI</text>
    </g>
    <text x="28" y="112" class="sans title">AI Integration</text>
    <text x="28" y="140" class="sans desc">LLM-powered features built into</text>
    <text x="28" y="161" class="sans desc">real product workflows.</text>
    <g stroke="#8b5cf6" stroke-opacity=".35" stroke-width="1">
      <path d="M60 196 L150 186 M60 196 L150 214 M60 220 L150 186 M60 220 L150 214 M150 186 L240 200 M150 214 L240 200 M240 200 L320 200"/>
    </g>
    <g fill="#a78bfa">
      <circle class="n" cx="60" cy="196" r="5"/>
      <circle class="n" cx="60" cy="220" r="5" style="animation-delay:-.4s"/>
      <circle class="n" cx="150" cy="186" r="5" style="animation-delay:-.8s"/>
      <circle class="n" cx="150" cy="214" r="5" style="animation-delay:-1.2s"/>
      <circle class="n" cx="240" cy="200" r="6" style="animation-delay:-1.6s"/>
    </g>
    <text x="330" y="205" class="mono" font-size="12" fill="#6d28d9">→ ✦</text>
    <g class="sans tag" style="fill:#6d28d9">
      <rect x="28" y="250" width="58" height="26" rx="13" fill="#8b5cf6" fill-opacity=".12"/><text x="57" y="267" text-anchor="middle">LLMs</text>
      <rect x="94" y="250" width="56" height="26" rx="13" fill="#8b5cf6" fill-opacity=".12"/><text x="122" y="267" text-anchor="middle">APIs</text>
      <rect x="158" y="250" width="100" height="26" rx="13" fill="#8b5cf6" fill-opacity=".12"/><text x="208" y="267" text-anchor="middle">Automation</text>
    </g>
  </g>

  <!-- Card 3: SEO -->
  <g transform="translate(0 342)">
    <rect x="1" y="1" width="588" height="318" rx="18" fill="url(#card)" stroke="#d0d7de"/>
    <rect class="trail" x="1" y="1" width="588" height="318" rx="18" pathLength="1800" style="animation-delay:-4s"/>
    <rect x="28" y="28" width="48" height="48" rx="12" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".45"/>
    <g transform="translate(52 52)" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-12 8 L-4 0 L2 5 L12 -7"/><path d="M5 -7 H12 V0"/>
    </g>
    <text x="28" y="112" class="sans title">SEO &amp; Performance</text>
    <text x="28" y="140" class="sans desc">Fast, discoverable sites</text>
    <text x="28" y="161" class="sans desc">engineered to rank.</text>
    <path class="fade" d="M28 232 L120 218 L210 222 L300 200 L390 190 L520 170 L520 236 L28 236 Z" fill="url(#area)"/>
    <path class="draw" d="M28 232 L120 218 L210 222 L300 200 L390 190 L520 170" fill="none" stroke="#2f81f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="fade" cx="520" cy="170" r="4.5" fill="#58a6ff"/>
    <g class="sans tag" style="fill:#1a7f37">
      <rect x="28" y="250" width="92" height="26" rx="13" fill="#3fb950" fill-opacity=".12"/><text x="74" y="267" text-anchor="middle">Core Vitals</text>
      <rect x="128" y="250" width="92" height="26" rx="13" fill="#3fb950" fill-opacity=".12"/><text x="174" y="267" text-anchor="middle">Tech SEO</text>
    </g>
  </g>
  <!-- Card 4: App development (Flutter) -->
  <g transform="translate(612 342)">
    <rect x="1" y="1" width="588" height="318" rx="18" fill="url(#card)" stroke="#d0d7de"/>
    <rect class="trail" x="1" y="1" width="588" height="318" rx="18" pathLength="1800" style="animation-delay:-5s"/>
    <rect x="28" y="28" width="48" height="48" rx="12" fill="#54c5f8" fill-opacity=".12" stroke="#54c5f8" stroke-opacity=".45"/>
    <g transform="translate(52 52)">
      <path d="M2,-14 L12,-14 L-6,4 L-11,-1 Z" fill="#54c5f8"/>
      <path d="M2,3 L12,3 L4,11 L12,19 L2,19 L-6,11 Z" fill="#54c5f8"/>
      <path d="M-1,11 L4,6 L9,11 L4,16 Z" fill="#01579b"/>
    </g>
    <text x="28" y="112" class="sans title">App Development</text>
    <text x="28" y="140" class="sans desc">Cross-platform mobile apps with</text>
    <text x="28" y="161" class="sans desc">Flutter, Dart and Firebase.</text>
    <g class="mono" font-size="12">
      <text x="28" y="204" fill="#57606a">hot reload</text>
      <text class="bolt" x="112" y="204" fill="#54c5f8">⚡ 0.4s</text>
    </g>
    <g class="sans tag" style="fill:#0369a1">
      <rect x="28" y="250" width="70" height="26" rx="13" fill="#54c5f8" fill-opacity=".12"/><text x="63" y="267" text-anchor="middle">Flutter</text>
      <rect x="106" y="250" width="56" height="26" rx="13" fill="#54c5f8" fill-opacity=".12"/><text x="134" y="267" text-anchor="middle">Dart</text>
      <rect x="170" y="250" width="82" height="26" rx="13" fill="#54c5f8" fill-opacity=".12"/><text x="211" y="267" text-anchor="middle">Firebase</text>
      <rect x="260" y="250" width="104" height="26" rx="13" fill="#54c5f8" fill-opacity=".12"/><text x="312" y="267" text-anchor="middle">Android · iOS</text>
    </g>
    <!-- phone mockup -->
    <g transform="translate(440 34)">
      <rect x="0" y="0" width="118" height="250" rx="20" fill="#ffffff" stroke="#54c5f8" stroke-opacity=".6" stroke-width="2"/>
      <rect x="44" y="9" width="30" height="6" rx="3" fill="#d0d7de"/>
      <rect class="ui" x="12" y="28" width="94" height="40" rx="8" fill="url(#accent)" fill-opacity=".85"/>
      <rect class="ui" x="12" y="78" width="94" height="26" rx="6" fill="#eaeef2" style="animation-delay:.25s"/>
      <rect class="ui" x="12" y="112" width="94" height="26" rx="6" fill="#eaeef2" style="animation-delay:.5s"/>
      <rect class="ui" x="12" y="146" width="94" height="26" rx="6" fill="#eaeef2" style="animation-delay:.75s"/>
      <circle class="ui" cx="24" cy="91" r="6" fill="#54c5f8" style="animation-delay:.25s"/>
      <circle class="ui" cx="24" cy="125" r="6" fill="#3fb950" style="animation-delay:.5s"/>
      <circle class="ui" cx="24" cy="159" r="6" fill="#8b5cf6" style="animation-delay:.75s"/>
      <rect class="ui" x="12" y="190" width="94" height="30" rx="15" fill="#54c5f8" fill-opacity=".2" stroke="#54c5f8" stroke-opacity=".6" style="animation-delay:1s"/>
      <rect x="40" y="234" width="38" height="4" rx="2" fill="#d0d7de"/>
    </g>
  </g>
</svg>
